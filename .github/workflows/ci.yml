name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The pure projects, where most of AkuWM's logic lives, are built and tested
  # on Linux: that is where they are written, and it keeps them honest about
  # having no Win32 in them.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Licence tripwire
        run: ./tools/licence-tripwire.sh

      - name: Build
        run: dotnet build AkuWM.sln --configuration Release

      # A trx alongside the console output: the job log needs admin rights to
      # read through the API, so a failure that only reproduces on the runner
      # is otherwise just "exit code 1". The artifact is public.
      - name: Test
        run: dotnet test tests/AkuWM.Tests/AkuWM.Tests.csproj --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=linux.trx" --results-directory test-results

      # An artifact needs a token to download, even on a public repo, and the
      # job log needs admin. Annotations need neither, so the trx is turned
      # into them: that is the only public channel for "which test failed".
      # pwsh, not bash: it is on both runners and reads XML natively, where
      # the bash + python + heredoc version died on the Windows runner
      # without producing a single annotation.
      - name: Which test failed
        if: failure()
        shell: pwsh
        run: |
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          Get-ChildItem test-results -Filter *.trx -EA SilentlyContinue | ForEach-Object {
            [xml] $doc = Get-Content $_.FullName -Raw
            Select-Xml -Xml $doc -Namespace $ns -XPath '//t:UnitTestResult[@outcome="Failed"]' | ForEach-Object {
              $r = $_.Node
              $msg = ($r.Output.ErrorInfo.Message -replace '\s+', ' ').Trim()
              $at = (($r.Output.ErrorInfo.StackTrace -split "`n") | Select-Object -First 1).Trim()
              $line = ("$msg | $at").Trim()
              if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
              Write-Host "::error title=$($r.testName)::$line"
            }
          }

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results/

      - name: Formatting
        run: dotnet format AkuWM.sln --verify-no-changes --severity warn

      - name: Publish win-x64 from Linux
        run: dotnet publish src/AkuWM.App/AkuWM.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      # The drop-in CLI goes with it: the installer puts both in Program Files,
      # and without it the hotkey script has nothing to talk to.
      - name: Publish the glazewm shim
        run: dotnet publish src/AkuWM.Shim/AkuWM.Shim.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: akuwm-win-x64
          path: |
            publish/akuwm.exe
            publish/glazewm.exe

  # And again on Windows, where it actually runs. The platform tests that need
  # a desktop skip themselves; what this proves is that the Windows-targeted
  # assemblies build and the suite passes on the real runtime.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build AkuWM.sln --configuration Release

      - name: Test
        run: dotnet test tests/AkuWM.Tests/AkuWM.Tests.csproj --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=windows.trx" --results-directory test-results

      # An artifact needs a token to download, even on a public repo, and the
      # job log needs admin. Annotations need neither, so the trx is turned
      # into them: that is the only public channel for "which test failed".
      # pwsh, not bash: it is on both runners and reads XML natively, where
      # the bash + python + heredoc version died on the Windows runner
      # without producing a single annotation.
      - name: Which test failed
        if: failure()
        shell: pwsh
        run: |
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          Get-ChildItem test-results -Filter *.trx -EA SilentlyContinue | ForEach-Object {
            [xml] $doc = Get-Content $_.FullName -Raw
            Select-Xml -Xml $doc -Namespace $ns -XPath '//t:UnitTestResult[@outcome="Failed"]' | ForEach-Object {
              $r = $_.Node
              $msg = ($r.Output.ErrorInfo.Message -replace '\s+', ' ').Trim()
              $at = (($r.Output.ErrorInfo.StackTrace -split "`n") | Select-Object -First 1).Trim()
              $line = ("$msg | $at").Trim()
              if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
              Write-Host "::error title=$($r.testName)::$line"
            }
          }

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: test-results/
